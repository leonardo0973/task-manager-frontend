services:
  - type: web
    name: task-manager-frontend-leonardo
    runtime: static
    # Render instala con el lockfile congelado y solo publica si lint, pruebas y build aprueban
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm verify
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      # URL HTTPS del Backend terminada en /api; se solicita al crear el Blueprint
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: cualquier ruta (/tasks, /tasks/:id, /login) entrega index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
